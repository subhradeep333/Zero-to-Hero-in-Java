name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile each Java file
        shell: bash
        run: |
          while IFS= read -r file
          do
            echo "Compiling $file"
            javac "$file"
          done < <(find . -name "*.java")